name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: careeriq, POSTGRES_PASSWORD: careeriq, POSTGRES_DB: careeriq }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U careeriq" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://careeriq:careeriq@localhost:5432/careeriq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
