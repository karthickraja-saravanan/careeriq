<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a">CareerIQ architecture</text>
  <text x="40" y="68" font-size="13" fill="#64748b">Modular monolith. Postgres holds data, vectors, full-text search and the job queue. Everything runs with docker compose.</text>

  <!-- Browser -->
  <rect x="40" y="100" width="230" height="250" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="58" y="126" font-size="15" font-weight="700" fill="#1e3a8a">Browser</text>
  <text x="58" y="146" font-size="12" fill="#334155">React + Vite, served by nginx</text>
  <g font-size="12" fill="#1e293b">
    <text x="58" y="178">Dashboard · Resumes · Jobs</text>
    <text x="58" y="198">Compare · Interview prep</text>
    <text x="58" y="218">Assistant chat (@CV1, @J2)</text>
    <text x="58" y="238">Settings · AI usage</text>
  </g>
  <text x="58" y="276" font-size="11" fill="#475569">Polls document status</text>
  <text x="58" y="294" font-size="11" fill="#475569">Reads streamed answers (SSE)</text>
  <text x="58" y="312" font-size="11" fill="#475569">Citation badges open sources</text>

  <!-- API -->
  <rect x="340" y="100" width="520" height="250" rx="14" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="358" y="126" font-size="15" font-weight="700" fill="#0f172a">Express API (TypeScript)</text>
  <text x="358" y="146" font-size="12" fill="#334155">helmet · rate limits · zod validation · logging · demo user (user_id on every query)</text>
  <g font-size="12" fill="#0f172a">
    <rect x="358" y="164" width="152" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="368" y="189">Documents + uploads</text>
    <rect x="522" y="164" width="152" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="532" y="189">Parsing (LLM + zod)</text>
    <rect x="686" y="164" width="156" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="696" y="189">Chunking by section</text>
    <rect x="358" y="214" width="152" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="368" y="239">Hybrid retrieval + RRF</text>
    <rect x="522" y="214" width="152" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="532" y="239">Analysis + scoring</text>
    <rect x="686" y="214" width="156" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="696" y="239">Chat + citation check</text>
    <rect x="358" y="264" width="152" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="368" y="289">Interview prep</text>
    <rect x="522" y="264" width="152" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="532" y="289">Job queue (pg-boss)</text>
    <rect x="686" y="264" width="156" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="696" y="289">LLM client + usage log</text>
  </g>
  <text x="358" y="328" font-size="11" fill="#64748b">routes → services → repositories. Routes never touch SQL.</text>

  <!-- LLM -->
  <rect x="930" y="100" width="230" height="120" rx="14" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="948" y="126" font-size="15" font-weight="700" fill="#78350f">Groq (OpenAI-compatible)</text>
  <text x="948" y="148" font-size="12" fill="#451a03">llama-3.3-70b-versatile</text>
  <text x="948" y="165" font-size="11" fill="#78350f">parse, judge, chat, prep</text>
  <text x="948" y="186" font-size="12" fill="#451a03">llama-3.1-8b-instant</text>
  <text x="948" y="203" font-size="11" fill="#78350f">question rewrite · Ollama optional</text>

  <!-- Embedder -->
  <rect x="930" y="240" width="230" height="110" rx="14" fill="#ecfdf5" stroke="#34d399"/>
  <text x="948" y="266" font-size="15" font-weight="700" fill="#065f46">Embedder (in the API)</text>
  <text x="948" y="288" font-size="12" fill="#064e3b">bge-small-en-v1.5, 384-d, q8</text>
  <text x="948" y="306" font-size="11" fill="#065f46">Transformers.js, runs locally</text>
  <text x="948" y="324" font-size="11" fill="#065f46">no API key, model cached in a volume</text>

  <!-- DB -->
  <rect x="340" y="620" width="520" height="150" rx="14" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="358" y="646" font-size="15" font-weight="700" fill="#4c1d95">Postgres 16 + pgvector</text>
  <g font-size="12" fill="#1e1b4b">
    <text x="358" y="674">documents · resumes (CV1…) · jobs (Job #1…)</text>
    <text x="358" y="694">chunks: embedding vector(384) with HNSW cosine index</text>
    <text x="358" y="714">chunks: tsv full-text column with GIN index</text>
    <text x="358" y="734">analyses · interview_preps · conversations · messages</text>
    <text x="358" y="754">llm_usage (tokens, latency) · pg-boss queue tables</text>
  </g>

  <!-- Files -->
  <rect x="40" y="640" width="230" height="90" rx="14" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="58" y="668" font-size="15" font-weight="700" fill="#0f172a">File volume</text>
  <text x="58" y="690" font-size="12" fill="#334155">original PDF / DOCX / TXT</text>
  <text x="58" y="708" font-size="11" fill="#475569">random names, outside web root</text>
  <path d="M270 685 H338" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <text x="276" y="676" font-size="10" fill="#64748b">stored path</text>

  <!-- Connections -->
  <path d="M270 225 H338" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrb)" marker-start="url(#arrb)"/>
  <text x="274" y="216" font-size="10" fill="#2563eb">REST · SSE</text>
  <path d="M860 160 H928" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <path d="M860 295 H928" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <path d="M600 350 V618" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <!-- Ingestion flow -->
  <text x="40" y="392" font-size="14" font-weight="700" fill="#0f172a">1. Ingestion (background jobs, retried on failure)</text>
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <rect x="40" y="408" width="150" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="115" y="431">Upload</text><text x="115" y="449" font-size="10" fill="#475569">type, bytes, 5 MB check</text>
    <rect x="228" y="408" width="150" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="303" y="431">Extract text</text><text x="303" y="449" font-size="10" fill="#475569">PDF / DOCX / TXT</text>
    <rect x="416" y="408" width="150" height="54" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="491" y="431">Parse with LLM</text><text x="491" y="449" font-size="10" fill="#475569">JSON, zod, 1 repair</text>
    <rect x="604" y="408" width="150" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="679" y="431">Chunk</text><text x="679" y="449" font-size="10" fill="#475569">role / skills / sections</text>
    <rect x="792" y="408" width="150" height="54" rx="10" fill="#ecfdf5" stroke="#34d399"/><text x="867" y="431">Embed</text><text x="867" y="449" font-size="10" fill="#475569">bge-small, 384 numbers</text>
    <rect x="980" y="408" width="180" height="54" rx="10" fill="#f5f3ff" stroke="#a78bfa"/><text x="1070" y="431">Store + mark ready</text><text x="1070" y="449" font-size="10" fill="#475569">vector + full-text index</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arr)" fill="none">
    <path d="M190 435 H226"/><path d="M378 435 H414"/><path d="M566 435 H602"/><path d="M754 435 H790"/><path d="M942 435 H978"/>
  </g>

  <!-- Chat flow -->
  <text x="40" y="508" font-size="14" font-weight="700" fill="#0f172a">2. Chat: question to cited answer</text>
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <rect x="40" y="524" width="150" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="115" y="547">Question</text><text x="115" y="565" font-size="10" fill="#475569">@CV1 / @J2 pick documents</text>
    <rect x="228" y="524" width="150" height="54" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="303" y="547">Rewrite follow-up</text><text x="303" y="565" font-size="10" fill="#475569">8B model, fails open</text>
    <rect x="416" y="524" width="150" height="54" rx="10" fill="#f5f3ff" stroke="#a78bfa"/><text x="491" y="547">Hybrid retrieval</text><text x="491" y="565" font-size="10" fill="#475569">vector + keyword, RRF k=60</text>
    <rect x="604" y="524" width="150" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="679" y="547">Build prompt</text><text x="679" y="565" font-size="10" fill="#475569">rules, ~6k-token context</text>
    <rect x="792" y="524" width="150" height="54" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="867" y="547">Stream answer</text><text x="867" y="565" font-size="10" fill="#475569">70B model over SSE</text>
    <rect x="980" y="524" width="180" height="54" rx="10" fill="#ecfdf5" stroke="#34d399"/><text x="1070" y="547">Check citations</text><text x="1070" y="565" font-size="10" fill="#475569">drop labels not retrieved</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arr)" fill="none">
    <path d="M190 551 H226"/><path d="M378 551 H414"/><path d="M566 551 H602"/><path d="M754 551 H790"/><path d="M942 551 H978"/>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#475569">
    <rect x="940" y="22" width="14" height="14" rx="3" fill="#fef3c7" stroke="#f59e0b"/><text x="962" y="34">LLM call (Groq)</text>
    <rect x="940" y="42" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#34d399"/><text x="962" y="54">Local embedding / code check</text>
    <rect x="940" y="62" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#a78bfa"/><text x="962" y="74">Postgres</text>
    <rect x="1040" y="62" width="14" height="14" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="1062" y="74">App code</text>
  </g>
  <text x="40" y="792" font-size="11" fill="#64748b">Scores are computed in code from per-requirement verdicts, not by the LLM. Every query is filtered by user_id.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
